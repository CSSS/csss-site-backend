[project]
name = "csss-site-backend"
version = "0.1"
requires-python = "~=3.13.0"

dependencies = [
    # major
    "fastapi==0.141.1",
    "gunicorn==26.1.0",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    # minor
    "xmltodict==1.0.4",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "gtfs-realtime-bindings==2.2.0",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.4", # linting and formatter
    "pre-commit",
]

test = [
    "pytest", # test framework
    "pytest-asyncio",
]

[project.urls]
Homepage = "https://api.sfucsss.org/"

# Pytest: Test framework
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["tests/wip"] # Don't test these paths
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
log_cli = false
log_cli_level = "INFO"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "--tb=short"
]
# These allow to mark test functions with decorators: `@pytest.mark.<marker>`
# You can then run tests with `pytest -m <marker>` to only run tests with that marker.
markers = [
    "integration: tests that require database or full app setup",
    "unit: isolated tests that do not require external services"
]

# Ruff: Formatter and linter
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"
exclude = [
    "src/alembic/*"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "A", "PTH", "W", "RUF", "C4", "PIE", "Q", "FLY"] # "ANN"
ignore = ["E501", "N806"]

[tool.ruff.lint.per-file-ignores]
"src/load_test_db.py" = ["F401"]

# [Based]Pyright: Type checker/LSP
[tool.pyright]
executionEnvironments = [
    { root = "src", pythonVersion = "3.13" },
    { root = "tests", extraPaths=["src"], pythonVersion = "3.13" }
]
typeCheckingMode = "standard"
reportAny = "none" # Allow the use of `Any` type
reportExplicitAny = "none" # Allow the declaration of `Any` type
