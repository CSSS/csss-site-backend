name: Alembic Upgrade Head
on: pull_request

jobs:
  alembic_upgrade_head:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: dev
      DB_PORT: "5432"
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:8080

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: main
          POSTGRES_HOST_AUTH_METHOD: trust

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U runner; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      # This will fail if there are divergent heads and alembic gets confused
      #   e.g. merging into main without passing this check
      - name: Run alembic upgrade head
        working-directory: src
        run: uv run alembic upgrade head
